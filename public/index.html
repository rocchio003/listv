<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPTV Hub</title>
<style>
:root{color-scheme:dark light;--b:#14161a;--c:#1e2127;--t:#e8eaed;--a:#4f8cff;--m:#8a919c}
@media(prefers-color-scheme:light){:root{--b:#f4f5f7;--c:#fff;--t:#1a1c20;--m:#6b7280}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:720px;padding:14px;font:15px system-ui,sans-serif;background:var(--b);color:var(--t)}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:20px 0 8px}

.card{background:var(--c);border-radius:12px;padding:12px;margin:10px 0;border-left:4px solid transparent;transition:background 0.2s, border-color 0.2s}
.card.type-m3u{border-left-color:#4f8cff;background:color-mix(in srgb, var(--c) 94%, #4f8cff)}
.card.type-xtream{border-left-color:#2a9d8f;background:color-mix(in srgb, var(--c) 94%, #2a9d8f)}
.card.type-stalker{border-left-color:#e76f51;background:color-mix(in srgb, var(--c) 94%, #e76f51)}
.card.type-epg{border-left-color:#9b5de5;background:color-mix(in srgb, var(--c) 94%, #9b5de5)}

input,select,button{font:inherit;color:inherit;background:transparent;border:1px solid #8884;border-radius:8px;padding:9px 10px;margin:3px 0;width:100%}
button{width:auto;cursor:pointer;background:var(--a);border:0;color:#fff;margin-right:6px}
button.s{background:#8883;color:var(--t)}
button.t{background:#2a9d8f;color:#fff}
button.sync{background:#f4a261;color:#fff}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.row label{display:flex;align-items:center;gap:6px;margin-right:8px}.row input{width:auto}
small{color:var(--m)}
.grp{max-height:260px;overflow:auto;margin-top:6px;color:var(--t)}
.grp label{display:flex;gap:8px;align-items:center;padding:5px 0}.grp input{width:auto;margin:0}
.sync-box{background:var(--b);border-radius:8px;padding:10px;margin:10px 0}
.sync-status{font-size:12px;margin-top:6px;opacity:0.8}
.epg-url{display:block;margin-top:6px;word-break:break-all;font-size:13px;color:var(--m);cursor:pointer;padding:4px;border-radius:4px;background:var(--b)}
.epg-url:hover{color:var(--t)}
.grp-actions{display:flex;gap:10px;font-size:12px;margin:6px 0}
.grp-actions a{color:var(--a);cursor:pointer;text-decoration:none}
.grp-actions a:hover{text-decoration:underline}
</style>
</head>
<body>
<h1>📺 IPTV Hub</h1>

<div class="card type-m3u">
  <small>Link per il player</small>
  <input id="link" readonly onclick="this.select()">
  <small id="len"></small>
  <div class="row">
    <button onclick="navigator.clipboard.writeText($('link').value);this.textContent='Copiato ✓'">Copia link</button>
    <button class="s" onclick="$('link').value&&window.open($('link').value)">Apri / testa</button>
  </div>
</div>

<div class="sync-box">
  <b>🔐 Sincronizzazione e Link Breve</b>
  <small style="display:block;margin:6px 0">Salva i dati nel cloud per ottenere un <b>link breve</b> e usarlo su più dispositivi.</small>
  <div class="row">
    <input id="syncKey" placeholder="La tua chiave di sincronizzazione" style="flex:1">
    <button class="sync" onclick="loadFromCloud()">Carica</button>
    <button class="sync" onclick="saveToCloud()">Salva</button>
  </div>
  <div class="row">
    <button class="s" onclick="generateKey()">Genera nuova chiave</button>
  </div>
  <div class="sync-status" id="syncStatus"></div>
</div>

<h2>Liste canali</h2>
<div id="list"></div>

<h2>Aggiungi lista</h2>
<div class="card type-m3u">
  <select id="t" onchange="ty()">
    <option value="m3u">M3U (URL)</option>
    <option value="xtream">Xtream Codes</option>
    <option value="stalker">Stalker / MAC</option>
  </select>
  <input id="n" placeholder="Nome">
  <input id="u" placeholder="URL lista M3U">
  <input id="us" placeholder="Username" hidden>
  <input id="pw" placeholder="Password" hidden>
  <input id="m" placeholder="MAC (00:1A:79:...)" hidden>
  <div class="row">
    <button onclick="add()">+ Aggiungi</button>
    <button class="t" id="testBtn" onclick="testLink()">Testa link</button>
  </div>
</div>

<h2>📅 Sorgenti EPG</h2>
<div id="epgList"></div>

<h2>Aggiungi sorgente EPG</h2>
<div class="card type-epg">
  <input id="epgN" placeholder="Nome (opzionale)">
  <input id="epgU" placeholder="URL XMLTV EPG">
  <div class="row">
    <button onclick="addEpg()">+ Aggiungi EPG</button>
    <button class="t" id="testEpgBtn" onclick="testEpg()">Testa EPG</button>
  </div>
</div>

<h2>Modifica un link esistente</h2>
<div class="card type-m3u">
  <input id="imp" placeholder="Incolla qui un link già generato (?c=... o ?k=...)">
  <button class="s" onclick="imp()">Carica configurazione</button>
</div>

<script>
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const b64e = (u) => btoa(String.fromCharCode(...u)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
const enc = async (o) =>
  b64e(new Uint8Array(await new Response(new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()));
const dec = async (t) =>
  JSON.parse(await new Response(new Blob([b64d(t)]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());

let D = { s: [], g: [] };
let syncKey = localStorage.syncKey || '';

try { 
  const saved = JSON.parse(localStorage.cfg);
  if (saved) { D.s = saved.s || []; D.g = saved.g || []; }
} catch {}

if (syncKey) $('syncKey').value = syncKey;

async function upd() {
  try { localStorage.cfg = JSON.stringify(D); } catch {}
  const hasSources = D.s.length > 0 || D.g.length > 0;
  let l = '';
  if (hasSources) {
    if (syncKey) l = location.origin + '/playlist.m3u?k=' + syncKey;
    else l = location.origin + '/playlist.m3u?c=' + (await enc(D));
  }
  $('link').value = l;
  const info = [];
  if (D.s.length) info.push(`${D.s.length} liste`);
  if (D.g.length) info.push(`${D.g.length} EPG`);
  if (l) {
    if (syncKey) $('len').textContent = '🔗 Link breve (sincronizzato) · ' + info.join(', ');
    else $('len').textContent = l.length + ' caratteri · ' + info.join(', ') + (l.length > 2000 ? ' ⚠️ link lungo: clicca "Salva" per accorciarlo' : '');
  } else $('len').textContent = '';
}

function render() {
  $('list').innerHTML = D.s.map((s, i) => `
    <div class="card type-${s.t || 'm3u'}">
      <b>${esc(s.n)}</b> <small style="text-transform:uppercase;opacity:0.8">${s.t}</small> <small>${(s.x || []).length ? ' · ' + s.x.length + ' gruppi esclusi' : ''}</small>
      <div class="row">
  <label><input type="checkbox" ${s.e !== 0 ? 'checked' : ''} onchange="D.s[${i}].e=this.checked?1:0;upd()">attiva</label>
function moveUp(i) {
  if (i <= 0) return;
  const item = D.s.splice(i, 1)[0];
  D.s.splice(i - 1, 0, item);
  render();
}

function moveDown(i) {
  if (i >= D.s.length - 1) return;
  const item = D.s.splice(i, 1)[0];
  D.s.splice(i + 1, 0, item);
  render();
}
  <button class="s" onclick="groups(${i})">Gruppi</button>
  <button class="s" onclick="del(${i})">Elimina</button>
</div>
      <div id="g${i}" data-state="closed"></div>
    </div>`).join('') || '<small>Nessuna lista ancora.</small>';
  
  $('epgList').innerHTML = D.g.map((g, i) => `
    <div class="card type-epg">
      ${g.n ? `<b>${esc(g.n)}</b> <small style="text-transform:uppercase;opacity:0.8">EPG</small>` : `<small style="text-transform:uppercase;opacity:0.8">EPG</small>`}
      <div class="row">
        <label><input type="checkbox" ${g.e !== 0 ? 'checked' : ''} onchange="D.g[${i}].e=this.checked?1:0;upd()">attiva</label>
        <button class="s" onclick="delEpg(${i})">Elimina</button>
      </div>
      <span class="epg-url" onclick="navigator.clipboard.writeText('${esc(g.u)}');alert('URL copiato!')" title="Clicca per copiare">${esc(g.u)}</span>
    </div>`).join('') || '<small>Nessuna sorgente EPG ancora.</small>';
  
  upd();
}

async function groups(i) {
  const s = D.s[i], el = $('g' + i);
  if (el.dataset.state === 'open') { el.innerHTML = ''; el.dataset.state = 'closed'; return; }
  if (el.dataset.state === 'loading') return;

  el.dataset.state = 'loading';
  el.textContent = 'Carico i gruppi…';

  try {
    const r = await fetch(`/api/playlist?groups=${i}&c=${await enc(D)}`);
    if (!r.ok) { el.textContent = 'Errore: ' + (await r.text()); el.dataset.state = 'closed'; return; }
    
    const g = await r.json();
    s.x = s.x || [];
    let sourceLink = s.u;
    if (s.t === 'xtream' && s.a && s.p) sourceLink = `${s.u.replace(/\/+$/, '')}/get.php?username=${encodeURIComponent(s.a)}&password=${encodeURIComponent(s.p)}&type=m3u_plus&output=ts`;
    else if (s.t === 'stalker' && s.m) sourceLink = `Portale: ${s.u} | MAC: ${s.m}`;

    const groupNames = Object.keys(g).sort();
    
    el.innerHTML = `
      <div style="margin-bottom:8px">
        <small>Link sorgente completo:</small>
        <input readonly value="${esc(sourceLink)}" onclick="this.select()" style="font-size:12px;width:100%;margin-top:4px;cursor:pointer;background:var(--b)">
      </div>
      <div class="grp-actions">
        <a onclick="selectAll(${i})">✓ Seleziona tutti</a>
        <span>·</span>
        <a onclick="deselectAll(${i})">✗ Deseleziona tutti</a>
      </div>
      <div class="grp" id="grpList${i}">
        ${groupNames.map(n => `<label><input type="checkbox" data-n="${esc(n)}" ${s.x.includes(n) ? '' : 'checked'} onchange="tg(${i},this)">${esc(n)} <small>(${g[n]})</small></label>`).join('')}
      </div>
      <small style="display:block;margin-top:6px">Spunta = incluso. Il link principale si aggiorna da solo.</small>
    `;
    el.dataset.state = 'open';
  } catch (e) {
    el.textContent = 'Errore di rete: ' + e.message;
    el.dataset.state = 'closed';
  }
}

// Seleziona tutti i gruppi (nessuno escluso)
function selectAll(i) {
  const s = D.s[i];
  s.x = [];
  const el = $('grpList' + i);
  if (el) el.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
  upd();
}

// Deseleziona tutti i gruppi (tutti esclusi)
function deselectAll(i) {
  const s = D.s[i];
  const el = $('grpList' + i);
  if (el) {
    s.x = Array.from(el.querySelectorAll('input[type="checkbox"]')).map(cb => { cb.checked = false; return cb.dataset.n; });
  }
  upd();
}

function tg(i, e) {
  const s = D.s[i], n = e.dataset.n;
  s.x = (s.x || []).filter((v) => v !== n);
  if (!e.checked) s.x.push(n);
  upd();
}

function del(i) { if (confirm('Eliminare questa lista?')) { D.s.splice(i, 1); render(); } }
function delEpg(i) { if (confirm('Eliminare questa sorgente EPG?')) { D.g.splice(i, 1); render(); } }

function ty() {
  const t = $('t').value;
  $('us').hidden = $('pw').hidden = t !== 'xtream';
  $('m').hidden = t !== 'stalker';
  $('t').closest('.card').className = `card type-${t}`;
  $('u').placeholder = t === 'm3u' ? 'URL lista M3U' : t === 'xtream' ? 'Server (http://host:porta)' : 'Portale (http://host/c/)';
}

async function testLink() {
  const t = $('t').value, u = $('u').value.trim();
  if (!u) return alert('Inserisci l\'URL per poterlo testare');
  const s = { t, n: $('n').value || t, u, x: [], e: 1 };
  if (t === 'xtream') { s.a = $('us').value.trim(); s.p = $('pw').value.trim(); }
  if (t === 'stalker') s.m = $('m').value.trim().toUpperCase();
  const btn = $('testBtn');
  btn.textContent = 'Test in corso...'; btn.disabled = true;
  try {
    const c = await enc({ s: [s], g: [] });
    const r = await fetch(`/api/playlist?groups=0&c=${c}`);
    if (!r.ok) alert('❌ Errore: ' + (await r.text()));
    else alert(`✅ Link valido! Trovati ${Object.keys(await r.json()).length} gruppi.`);
  } catch (e) { alert('❌ Errore: ' + e.message); }
  finally { btn.textContent = 'Testa link'; btn.disabled = false; }
}

async function testEpg() {
  const u = $('epgU').value.trim();
  if (!u) return alert('Inserisci l\'URL EPG');
  const btn = $('testEpgBtn');
  btn.textContent = 'Test in corso...'; btn.disabled = true;
  try {
    const r = await fetch(u, { method: 'HEAD' });
    if (r.ok) alert('✅ URL EPG raggiungibile!');
    else alert('⚠️ URL EPG non raggiungibile (HTTP ' + r.status + ')');
  } catch (e) { alert('❌ Errore di rete: ' + e.message); }
  finally { btn.textContent = 'Testa EPG'; btn.disabled = false; }
}

function add() {
  const t = $('t').value, u = $('u').value.trim();
  if (!u) return alert('Inserisci l\'URL');
  const s = { t, n: $('n').value || t, u, x: [], e: 1, pf: 1 };
  if (t === 'xtream') { s.a = $('us').value.trim(); s.p = $('pw').value.trim(); }
  if (t === 'stalker') s.m = $('m').value.trim().toUpperCase();
  D.s.push(s);
  ['n', 'u', 'us', 'pw', 'm'].forEach(x => $(x).value = '');
  render();
}

function addEpg() {
  const n = $('epgN').value.trim(), u = $('epgU').value.trim();
  if (!u) return alert('Inserisci l\'URL EPG');
  D.g.push({ n, u, e: 1 });
  $('epgN').value = ''; $('epgU').value = '';
  render();
}

async function imp() {
  try {
    const url = new URL($('imp').value.trim());
    if (url.searchParams.has('k')) {
      syncKey = url.searchParams.get('k');
      $('syncKey').value = syncKey;
      localStorage.syncKey = syncKey;
      await loadFromCloud();
    } else {
      const decoded = await dec(url.searchParams.get('c'));
      D.s = decoded.s || [];
      D.g = decoded.g || [];
      render();
    }
    $('imp').value = '';
  } catch { alert('Link non valido'); }
}

function generateKey() {
  const array = new Uint8Array(16);
  crypto.getRandomValues(array);
  const key = Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
  $('syncKey').value = key;
  syncKey = key;
  localStorage.syncKey = key;
  showStatus('✅ Nuova chiave generata. Clicca "Salva" per attivare il link breve.', 'success');
}

async function saveToCloud() {
  const key = $('syncKey').value.trim();
  if (!key) return alert('Genera o inserisci prima una chiave di sincronizzazione');
  syncKey = key;
  localStorage.syncKey = key;
  showStatus('⏳ Salvataggio in corso...', 'loading');
  try {
    const r = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ k: key, cfg: D })
    });
    if (r.ok) {
      showStatus('✅ Dati salvati! Il link in alto è ora breve.', 'success');
      upd();
    } else {
      showStatus('❌ Errore: ' + (await r.text()), 'error');
    }
  } catch (e) {
    showStatus('❌ Errore di rete: ' + e.message, 'error');
  }
}

async function loadFromCloud() {
  const key = $('syncKey').value.trim();
  if (!key) return alert('Inserisci la chiave di sincronizzazione');
  showStatus(' Caricamento in corso...', 'loading');
  try {
    const r = await fetch('/api/sync?k=' + encodeURIComponent(key));
    if (r.ok) {
      const data = await r.json();
      D.s = data.s || [];
      D.g = data.g || [];
      syncKey = key;
      localStorage.syncKey = key;
      render();
      showStatus('✅ Dati caricati! (' + D.s.length + ' liste, ' + D.g.length + ' EPG)', 'success');
    } else {
      showStatus('❌ Errore: ' + (await r.text()), 'error');
    }
  } catch (e) {
    showStatus('❌ Errore di rete: ' + e.message, 'error');
  }
}

function showStatus(msg, type) {
  const el = $('syncStatus');
  el.textContent = msg;
  el.style.color = type === 'success' ? '#2a9d8f' : type === 'error' ? '#e76f51' : 'var(--m)';
}

ty();
render();
</script>
</body>
</html>
